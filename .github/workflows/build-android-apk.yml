name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub hosted Ubuntu images already ship with Android SDK and sdkmanager.
      # Avoid android-actions/setup-android@v3 because it attempts to install the
      # removed legacy "tools" SDK package.
      - name: Verify Android SDK and accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Copy APK to recognizable name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IT-Asset-Control-307-debug.apk

      - name: Publish APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: IT-Asset-Control-307-APK
          path: dist/IT-Asset-Control-307-debug.apk
          if-no-files-found: error
