plugins {
    id 'com.android.application'
}

android {
    namespace 'id.eshaberbagi.assetcontrol307'
    compileSdk 35

    defaultConfig {
        applicationId 'id.eshaberbagi.assetcontrol307'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.browser:browser:1.8.0'
}
